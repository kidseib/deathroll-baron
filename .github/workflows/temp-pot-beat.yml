name: temp-pot-beat

on:
  push:
    branches: [main]
    paths:
      - tools/pot_beat_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Apply the pot beat patch
        run: python3 tools/pot_beat_patch.py
      - name: Verify the beat
        run: |
          grep -q 'local POT_LEAD = 0.20' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'function J.PotReturn()' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'function J.DealPending()' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'if not J.PotSeated() then' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'J.DealPending()' addon/DeathrollBaron/DeathrollBaron.lua
          ! grep -qF 'J.PotSlide(won)' addon/DeathrollBaron/DeathrollBaron.lua
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "table pot: give the slide its own beat and seat it before dealing"
          git push origin HEAD:main
