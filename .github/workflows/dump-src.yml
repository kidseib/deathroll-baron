name: dump-src
on:
  workflow_dispatch:
    inputs:
      start:
        description: first line to print
        default: "1795"
        required: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tail-of-file
        run: |
          f=addon/DeathrollBaron/DeathrollBaron.lua
          s="${{ github.event.inputs.start }}"
          echo "printing from line $s"
          awk -v s="$s" 'NR>=s {printf "%5d| %s\n", NR, $0}' "$f"
