name: temp-pot-cross

on:
  push:
    branches: [main]
    paths:
      - tools/pot_cross_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Apply the pot crossing patch
        run: python3 tools/pot_cross_patch.py
      - name: Verify the crossing
        run: |
          grep -q 'local POT_ARC = 10' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'local POT_CROSS = 0.58' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'if a.shrink then' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'arc = POT_ARC' addon/DeathrollBaron/DeathrollBaron.lua
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "table pot: lift and soften the slide over the winner's roll"
          git push origin HEAD:main
