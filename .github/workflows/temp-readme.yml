name: temp-readme

on:
  push:
    branches: [main]
    paths:
      - tools/readme_patch.py
      - .github/workflows/temp-readme.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the install section
        run: python3 tools/readme_patch.py
      - name: Commit
        run: |
          if git diff --quiet -- README.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add install steps to the README"
          git push origin HEAD:main
