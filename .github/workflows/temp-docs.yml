name: temp-docs

on:
  push:
    branches: [main]
    paths:
      - tools/docs_patch.py
      - .github/workflows/temp-docs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert the beta changelog section
        run: python3 tools/docs_patch.py
      - name: Verify the beta docs
        run: |
          set -e
          test "$(grep -c '^## \[0.0.14-beta.1\]' CHANGELOG.md)" -eq 1
          grep -q '^## Version: 0.0.14-beta.1' addon/DeathrollBaron/DeathrollBaron.toc
          grep -q 'status-beta' README.md
          grep -q 'felt band' README.md
      - name: Commit the changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: add the 0.0.14 beta changelog"
          git push origin HEAD:main
