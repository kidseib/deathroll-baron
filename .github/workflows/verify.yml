name: verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check the shipped pair
        run: |
          set -euo pipefail
          cd /tmp
          base=https://github.com/kidseib/deathroll-baron/releases/download/v0.0.11/DeathrollBaron-0.0.11.zip
          curl -sSL -o z.zip "$base"
          curl -sSL -o z.sha "$base.sha256"
          ls -l z.zip z.sha
          echo "--- sha256 file ---"
          cat z.sha
          echo "--- actual ---"
          sha256sum z.zip
          want=$(awk '{print $1}' z.sha)
          got=$(sha256sum z.zip | awk '{print $1}')
          if [ "$want" = "$got" ]; then echo PAIR OK; else echo PAIR MISMATCH; exit 1; fi
          echo "--- contents ---"
          unzip -l z.zip
