name: temp-visual-context

on:
  push:
    branches: [main]
    paths:
      - tools/visual_ctx.py

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump the UI context
        run: python3 tools/visual_ctx.py
      - name: Commit the context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual_ctx.txt tools/visual_ctx_tail.txt
          git commit -m "chore: visual pass context files"
          git push origin HEAD:main
