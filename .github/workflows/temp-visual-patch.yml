name: temp-visual-patch

on:
  push:
    branches: [main]
    paths:
      - tools/visual_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Apply the visual patch
        run: python3 tools/visual_patch.py
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "visual pass: header, section rules, odds bar, shop row"
          git push origin HEAD:main
