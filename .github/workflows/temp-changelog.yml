name: temp-changelog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-changelog.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix the beta wording
        run: sed -i 's/This is the first build published as a beta;/This is a beta checkpoint after 0.0.13;/' CHANGELOG.md
      - name: Commit
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: correct the beta checkpoint wording"
          git push origin HEAD:main
