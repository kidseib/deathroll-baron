name: patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump tail
        run: |
          echo "TOTAL $(wc -l < addon/DeathrollBaron/DeathrollBaron.lua)"
          awk 'NR>=1200 {printf "%5d| %s\n", NR, $0}' addon/DeathrollBaron/DeathrollBaron.lua
      - name: lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: apply
        run: |
          if [ -f tools/patch_010.py ]; then
            python3 tools/patch_010.py
            luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua && echo "PARSE OK"
            git config user.name bot
            git config user.email bot@users.noreply.github.com
            git commit -am "0.0.10: tension curve, reel, one ceremony"
            git push
            git --no-pager diff --stat HEAD~1
          else
            echo "no patch script yet"
          fi
