name: autospin
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: apply
        run: |
          set -e
          python3 tools/auto_011.py
          luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
          echo "PARSE OK"
          git config user.email "bot@users.noreply.github.com"
          git config user.name "bot"
          git add -A
          git commit -m "0.0.11: auto-spin on the ROLL button"
          git push
