name: temp-pot-timing

on:
  push:
    branches: [main]
    paths:
      - tools/pot_timing_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Apply the pot timing patch
        run: python3 tools/pot_timing_patch.py
      - name: Verify anchors
        run: |
          grep -q 'or J.potAnim or J.coinAnim' addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'GOLD\[3\], 0.30' addon/DeathrollBaron/DeathrollBaron.lua
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "table pot: let the ending finish before the next auto deal"
          git push origin HEAD:main
