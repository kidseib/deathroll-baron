name: temp-release

on:
  push:
    branches: [main]
    paths:
      - tools/temp_release_patch.py

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump the version and changelog
        run: python3 tools/temp_release_patch.py
      - name: Verify
        run: |
          grep -q '^## Version: 0.0.13$' addon/DeathrollBaron/DeathrollBaron.toc
          grep -q '^## \[0.0.13\]' CHANGELOG.md
      - name: Commit the result
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.toc CHANGELOG.md
          git commit -m "0.0.13: buff prices, odds bar and float fixes"
          git push origin HEAD:main
