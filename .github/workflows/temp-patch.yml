name: temp-patch

on:
  push:
    branches: [main]
    paths:
      - tools/temp_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch
        run: python3 tools/temp_patch.py
      - name: Parse Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet -- addon/DeathrollBaron/DeathrollBaron.lua; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "0.0.12 fix: costs, odds and payout floats back on screen"
          git push origin HEAD:main
