name: temp-table-inspect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-table-inspect.yml

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show the board
        run: |
          grep -n 'rail\|youPanel\|themPanel\|Panel(frame\|panel' addon/DeathrollBaron/DeathrollBaron.lua | head -80
          echo '--- board block ---'
          sed -n '1250,1435p' addon/DeathrollBaron/DeathrollBaron.lua
