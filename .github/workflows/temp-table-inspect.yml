name: temp-table-inspect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-table-inspect.yml

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show the board
        run: |
          grep -n 'frame:SetSize\|function Panel' addon/DeathrollBaron/DeathrollBaron.lua
          echo '--- board block ---'
          sed -n '870,975p' addon/DeathrollBaron/DeathrollBaron.lua
