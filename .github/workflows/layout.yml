name: layout
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          python3 tools/patch_layout.py
          luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
          echo PARSE_OK
          git config user.name deathroll-baron-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m "0.0.9: odds bar clears the range line and the log"
          git push
