name: temp-table

on:
  push:
    branches: [main]
    paths:
      - tools/table_patch.py
      - .github/workflows/temp-table.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Apply the table surface patch
        run: python3 tools/table_patch.py
      - name: Verify the surface
        run: |
          set -e
          f=addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'the felt band' "$f"
          grep -q 'SetColorTexture(0.060, 0.085, 0.070, 0.72)' "$f"
          grep -q 'felt:SetHeight(72)' "$f"
          grep -q 'rail:SetSize(1, 72)' "$f"
          grep -q 'rail:SetColorTexture(GOLD\[1\], GOLD\[2\], GOLD\[3\], 0.42)' "$f"
          ! grep -q 'rail:SetSize(1, 68)' "$f"
          test "$(grep -c 'local felt = frame:CreateTexture' "$f")" -eq 1
          test "$(grep -c 'local rail = J.fx:CreateTexture' "$f")" -eq 1
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Show the diff
        run: git diff -- addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet -- addon/DeathrollBaron/DeathrollBaron.lua; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "table: felt board band and brass seam rail"
          git push origin HEAD:main
