name: temp-coin

on:
  push:
    branches: [main]
    paths:
      - tools/coin_patch.py
      - .github/workflows/temp-coin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Apply the stake coin patch
        run: python3 tools/coin_patch.py
      - name: Verify the coin stack
        run: |
          set -e
          f=addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'pot.coins = {}' "$f"
          grep -q 'stake tiers: 3 coins' "$f"
          grep -q 'for i = 1, 6 do' "$f"
          grep -q 'c:Hide()' "$f"
          grep -q 'if stake >= 100000 then coins = 6' "$f"
          grep -q 'elseif stake >= 10000 then coins = 5' "$f"
          grep -q 'elseif stake >= 1000 then coins = 4 end' "$f"
          grep -q 'J.pot.label:SetText(Money(stake))' "$f"
          test "$(grep -c 'J.pot.label:SetText(Money(stake))' "$f")" -eq 1
          test "$(grep -c 'J.pot.coins\[i\]:Show()' "$f")" -eq 1
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Show the diff
        run: git diff -- addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet -- addon/DeathrollBaron/DeathrollBaron.lua; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "table pot: stack coins by stake tier"
          git push origin HEAD:main
