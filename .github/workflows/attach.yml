name: attach
on: workflow_dispatch
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          set -euo pipefail
          cd addon
          zip -r ../DeathrollBaron-0.0.10.zip DeathrollBaron
          cd ..
          sha256sum DeathrollBaron-0.0.10.zip > DeathrollBaron-0.0.10.zip.sha256
          ls -la DeathrollBaron-0.0.10.zip*
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.0.10 DeathrollBaron-0.0.10.zip DeathrollBaron-0.0.10.zip.sha256 --clobber
          gh release view v0.0.10 --json assets --jq '.assets[] | [.name, .size] | @tsv'
