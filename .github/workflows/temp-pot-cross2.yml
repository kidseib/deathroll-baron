name: temp-pot-cross2

on:
  push:
    branches: [main]
    paths:
      - tools/pot_cross_patch.py
      - .github/workflows/temp-pot-cross2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Relax the reset count
        run: |
          sed -i 's/("J.pot.body:SetScale(1)", 4)/("J.pot.body:SetScale(1)", 5)/' tools/pot_cross_patch.py
          grep -q '("J.pot.body:SetScale(1)", 5)' tools/pot_cross_patch.py
      - name: Apply the pot crossing patch
        run: python3 tools/pot_cross_patch.py
      - name: Verify the crossing
        run: |
          set -e
          f=addon/DeathrollBaron/DeathrollBaron.lua
          grep -q 'local POT_ARC = 10' "$f"
          grep -q 'local POT_CROSS = 0.58' "$f"
          grep -q 'if a.shrink then' "$f"
          grep -q 'arc = POT_ARC' "$f"
          grep -q 'shrink = true' "$f"
          grep -q 'x1 = won and -170 or 170' "$f"
          grep -q 'y1 = -2' "$f"
          test "$(grep -c 'J.pot.body:SetScale(1)' "$f")" -eq 5
          test "$(grep -c 'SetScale(1 - 0.24 \* bump)' "$f")" -eq 1
          test "$(grep -c 'math.sin(k \* math.pi) \* a.arc' "$f")" -eq 1
      - name: Parse Lua
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit the result
        run: |
          if git diff --quiet -- addon/DeathrollBaron/DeathrollBaron.lua; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon/DeathrollBaron/DeathrollBaron.lua
          git commit -m "table pot: lift and soften the slide over the winner's roll"
          git push origin HEAD:main
