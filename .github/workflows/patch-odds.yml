name: Patch odds

# One-shot: teaches the odds solver about the Desperate affix, then deletes itself.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply the patch
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          p = pathlib.Path("addon/DeathrollBaron/DeathrollBaron.lua")
          src = p.read_text(encoding="utf-8")
          orig = src

          def fail(msg):
              print("FAIL " + msg)
              sys.exit(1)

          # 1. constants next to SCHEMA
          if "local DESPERATE_FROM" not in src:
              if "local SCHEMA = 5\n" not in src:
                  fail("SCHEMA line")
              src = src.replace("local SCHEMA = 5\n",
                  "local SCHEMA = 5\n\n"
                  "-- Desperate is the one enemy modifier the odds solver has to know\n"
                  "-- about by name: it lifts their luck only once the range is small, so\n"
                  "-- no single enemy bias can describe the table. StepMatch and OddsUpTo\n"
                  "-- both read these constants, so the two cannot disagree again.\n"
                  "local DESPERATE_FROM = 20\n"
                  "local DESPERATE_LUCK = 0.30\n", 1)

          # 2. signature
          if "OddsUpTo(m, pLuck, eLuck)" in src:
              src = src.replace("OddsUpTo(m, pLuck, eLuck)", "OddsUpTo(m, pLuck, eLuck, desperate)", 1)
          elif "OddsUpTo(m, pLuck, eLuck, desperate)" not in src:
              fail("OddsUpTo signature")

          # 3. cache key
          if 'floor(eLuck * 1000)"\n' in src or 'floor(eLuck * 1000)$' in src:
              pass
          src, n = re.subn(r'(local key = floor\(pLuck \* 1000\) \.\. ":" \.\. floor\(eLuck \* 1000\))(?! \.\.)()',
                           r'\1 .. ":" .. (desperate and 1 or 0)', src)
          print("cache keys: %d" % n)

          # 4. split the shared qe line and move the enemy bias into the row
          old_qe = re.compile(r"(?m)^(\s*)local qp, qe = min\(1, math\.abs\(pLuck\)\), min\(1, math\.abs\(eLuck\)\)\s*$")
          if old_qe.search(src):
              src = old_qe.sub(r"\1local qp = min(1, math.abs(pLuck))", src, count=1)
              src, n = re.subn(r"(?m)^\s*local eWantLow = eLuck < 0\s*\n", "", src, count=1)
              print("eWantLow line removed: %d" % n)
          elif "local eb = eLuck" not in src:
              fail("enemy bias lines")

          if "local eb = eLuck" not in src:
              m = re.search(r"(?m)^(\s*)for r = entry\.n \+ 1, m do\s*$", src)
              if not m:
                  fail("row loop")
              ind = m.group(1) + "    "
              block = (m.group(0) + "\n"
                  + ind + "-- Desperate only bites under 20, which is exactly where it matters,\n"
                  + ind + "-- so each row carries its own enemy bias.\n"
                  + ind + "local eb = eLuck\n"
                  + ind + "if desperate and r <= DESPERATE_FROM then eb = eb + DESPERATE_LUCK end\n"
                  + ind + "local qe = min(1, math.abs(eb))\n"
                  + ind + "local eWantLow = eb < 0")
              src = src[:m.start()] + block + src[m.end():]

          # 5. call sites: append the flag, derived from the config passed in
          def fix_call(mm):
              inner = mm.group(1)
              if "desperate" in inner:
                  return mm.group(0)
              parts = inner.split(",")
              if len(parts) != 3:
                  print("uneven call: OddsUpTo(" + inner + ")")
                  return mm.group(0)
              owner = parts[0].strip().rsplit(".", 1)[0]
              return "OddsUpTo(" + inner + ", " + owner + ".desperate and true or false)"

          print("call sites before: " + repr(re.findall(r"OddsUpTo\(([^()]*)\)", src)))
          src = re.sub(r"OddsUpTo\(([^()]*)\)", fix_call, src)
          print("call sites after:  " + repr(re.findall(r"OddsUpTo\(([^()]*)\)", src)))

          # 6. StepMatch uses the constants
          src, n = re.subn(r"s\.max <= 20 then(\s*)bias = bias \+ 0\.30",
                           r"s.max <= DESPERATE_FROM then\1bias = bias + DESPERATE_LUCK", src)
          print("step match rewrites: %d" % n)
          if n != 1:
              for i, ln in enumerate(src.split("\n")):
                  if ".max <= 20" in ln or "0.30" in ln:
                      print("line %d: %s" % (i, ln))
              fail("step match")

          if src == orig:
              print("no change")
              sys.exit(0)

          p.write_text(src, encoding="utf-8")
          print("patched, %d -> %d bytes" % (len(orig), len(src)))
          PY
      - name: Syntax check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1 > /dev/null
          luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
          echo "lua ok"
      - name: Commit
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "Deathroll Baron CI"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "0.0.7: model the Desperate affix in the odds solver"
          git push origin HEAD:main
