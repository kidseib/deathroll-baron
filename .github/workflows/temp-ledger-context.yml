name: temp-ledger-context

on:
  push:
    branches: [main]
    paths:
      - tools/ledger_ctx.py

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump the settlement context
        run: python3 tools/ledger_ctx.py
      - name: Commit the context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ledger_ctx.txt
          git commit -m "chore: settlement context file"
          git push origin HEAD:main
