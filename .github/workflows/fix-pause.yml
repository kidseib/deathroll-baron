name: fix-pause
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Patch
        run: python3 .github/scripts/fix_pause.py
      - name: Syntax check
        run: luac5.1 -p addon/DeathrollBaron/DeathrollBaron.lua
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "Error.Seib"
          git config user.email "kidseib@gmail.com"
          git add -A
          git commit -m "0.0.12: pace the breath by Fast Hands"
          git push origin HEAD:main
